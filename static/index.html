<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>worm</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 15px/1.5 -apple-system, system-ui, sans-serif;
    background: #0a0a0a; color: #e5e5e5;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid #1f1f1f;
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
  header small { color: #666; font-size: 12px; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; max-width: 760px; width: 100%; margin: 0 auto; }
  .msg { margin-bottom: 18px; white-space: pre-wrap; word-wrap: break-word; }
  .user { color: #888; }
  .user::before { content: "you: "; color: #444; }
  .bot::before { content: "worm: "; color: #e50914; font-weight: 600; }
  .bot { color: #e5e5e5; }
  form {
    border-top: 1px solid #1f1f1f; padding: 12px 20px;
    display: flex; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto;
  }
  input {
    flex: 1; background: #141414; border: 1px solid #222;
    color: #e5e5e5; padding: 12px 14px; border-radius: 10px;
    font: inherit; outline: none;
  }
  input:focus { border-color: #333; }
  button {
    background: #e5e5e5; color: #0a0a0a; border: 0;
    padding: 0 18px; border-radius: 10px; font: inherit; font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: default; }
  .err { color: #e50914; padding: 6px 20px; font-size: 13px; text-align: center; }
</style>
</head>
<body>
  <header>
    <h1>worm</h1>
    <small id="status">ready</small>
  </header>
  <div id="chat"></div>
  <div class="err" id="err"></div>
  <form id="f">
    <input id="q" placeholder="ask anything…" autocomplete="off" />
    <button id="b">send</button>
  </form>
<script>
const chat = document.getElementById("chat");
const err = document.getElementById("err");
const f = document.getElementById("f");
const q = document.getElementById("q");
const b = document.getElementById("b");
const status = document.getElementById("status");

const history = [];

function add(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "bot");
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

f.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text) return;
  q.value = "";
  err.textContent = "";
  add("user", text);
  history.push({ role: "user", content: text });

  const bubble = add("assistant", "");
  b.disabled = true;
  status.textContent = "thinking…";

  try {
    const res = await fetch("/public/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });

    if (!res.ok) {
      const t = await res.text();
      err.textContent = t;
      bubble.remove();
      b.disabled = false;
      status.textContent = "ready";
      return;
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let acc = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      acc += dec.decode(value, { stream: true });
      bubble.textContent = acc;
      chat.scrollTop = chat.scrollHeight;
    }
    history.push({ role: "assistant", content: acc });
    if (history.length > 20) history.splice(0, history.length - 20);
  } catch (e) {
    err.textContent = String(e);
    bubble.remove();
  } finally {
    b.disabled = false;
    status.textContent = "ready";
  }
});
</script>
</body>
</html>
